<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffa751">
<title>Browser Guess PT-BR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b1f5e;--pink:#ff4d8d;--sun:#ffc933;--teal:#00c2a8;--violet:#7a4dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:#ffa751;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
 padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.bg-sun{background:linear-gradient(160deg,#ffe259 0%,#ffa751 45%,#ff6a88 100%)}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(59,31,94,.15)}
.btn{border:0;border-radius:16px;color:#fff;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.play{width:100%;padding:12px;font-size:1.15rem;background:linear-gradient(90deg,#ff4d8d,#ff7a45);display:flex;align-items:center;justify-content:center;gap:10px;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03)}}
.logo{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;font-size:1.5rem;color:var(--pink);box-shadow:0 3px 0 rgba(59,31,94,.2);animation:wig 3s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.08)}}
h1{margin:4px 0 0;font-size:1.6rem;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(59,31,94,.35);letter-spacing:.5px}
.sub{margin:2px 0 0;font-size:.78rem;color:var(--ink);font-weight:500}
.lbl{margin:0 0 4px;font-size:.75rem;font-weight:700}
#fs-btn{position:fixed;z-index:50;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(59,31,94,.2)}
.in-game #fs-btn{display:none}
.bub{position:absolute;bottom:-12%;z-index:0;pointer-events:none;opacity:.4;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(40deg)}}

/* Setup */
.setup,.result{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px;justify-content:space-between;position:relative;z-index:1}
.hero{text-align:center;padding-top:2px}
.opts{display:flex;justify-content:center;gap:6px;margin-top:6px}
.opt{border:2px solid rgba(59,31,94,.25);background:rgba(255,255,255,.55);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:600;opacity:.65}
.opt.on{background:#fff;border-color:var(--violet);opacity:1}
.pick{flex:1;min-height:0;display:flex;flex-direction:column}
.themes-wrapper{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{display:flex;align-items:center;gap:6px;padding:6px 8px;border:2px solid transparent;text-align:left;color:var(--ink);transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile.sel{border-color:var(--pink);background:#fff4c2;box-shadow:0 3px 0 rgba(255,77,141,.3);animation:selpop .3s}
@keyframes selpop{50%{transform:scale(1.07)}}
.ico{flex:none;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:.8rem}
.tile b{display:block;font-size:.75rem;font-weight:600;line-height:1.1}
.tile small{font-size:.62rem;opacity:.65}
.tile div:last-child{min-width:0}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.time-btn{padding:7px 0;border:2px solid transparent;border-radius:12px;background:#fff;font-weight:700;font-size:.8rem;color:var(--ink);box-shadow:0 2px 0 rgba(59,31,94,.15);transition:all .1s}
.time-btn.sel{background:var(--violet);color:#fff;border-color:var(--ink);transform:translateY(-2px)}

/* Contagem */
#countdown-screen{align-items:center;justify-content:center;text-align:center;z-index:40}
#countdown-screen>*{position:relative;z-index:1}
#countdown-number{font-size:min(34vw,34vh);font-weight:700;line-height:1;color:#fff;text-shadow:0 8px 0 rgba(59,31,94,.3);animation:pop .9s ease-out infinite}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg)}40%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.hint{margin-top:14px;padding:8px 16px;border-radius:999px;background:#fff;font-size:.85rem;font-weight:500;max-width:92%}

/* Jogo */
#game-screen{z-index:40;display:grid;gap:10px;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "word word" "skip ok";color:#fff}
.bar{grid-area:bar;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:700;display:flex;align-items:center;gap:6px}
.pill.urgent{background:#ff3b5c;color:#fff;animation:pulse .6s infinite}
.pill.bump{animation:bump .35s}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes bump{40%{transform:scale(1.35) rotate(-6deg)}}
.x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink)}
.wordbox{grid-area:word;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;cursor:pointer}
.tag{background:rgba(255,255,255,.9);color:var(--ink);padding:3px 14px;border-radius:999px;font-weight:700;font-size:.75rem;margin-bottom:10px}
#word-display{margin:0;max-width:100%;font-size:clamp(2.2rem,11vw,4.2rem);line-height:1.1;font-weight:700;text-shadow:0 4px 0 rgba(59,31,94,.3);overflow-wrap:anywhere}
#word-display.in-ok{animation:wOk .35s cubic-bezier(.3,1.6,.5,1)}
#word-display.in-skip{animation:wSkip .3s ease-out}
@keyframes wOk{0%{transform:translateY(-50px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes wSkip{0%{transform:translateY(50px) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px;font-size:.85rem}
.act i{font-size:1.4rem}
.skip{grid-area:skip;background:#ff7a45}.ok{grid-area:ok;background:#12b886}
.l-only{display:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s}
#fb{position:absolute;left:50%;top:42%;z-index:5;pointer-events:none;opacity:0;font-size:clamp(1.8rem,9vw,3.4rem);font-weight:700;white-space:nowrap;text-shadow:0 4px 0 rgba(0,0,0,.3)}
#fb.show{animation:fbpop .7s ease-out}
@keyframes fbpop{0%{opacity:0;transform:translate(-50%,0) scale(.4)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.part{position:fixed;z-index:6;pointer-events:none;animation:burst .75s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.4);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Resultado */
.result{grid-template-rows:auto minmax(0,1fr) auto}
.top{text-align:center;padding-top:4px}
.listbox{min-height:0;display:flex;flex-direction:column;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{padding:8px}.stat small{font-size:.7rem;font-weight:600;opacity:.7}
.stat b{display:block;font-size:2.2rem;line-height:1.1}
#word-history{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:#f6f1ff;font-size:.85rem;font-weight:500;animation:rowin .3s both}
@keyframes rowin{from{opacity:0;transform:translateX(-14px)}}
.chip{flex:none;font-size:.7rem;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff}
.chip.ok{background:#12b886}.chip.no{background:#ff7a45}
.confetti{position:fixed;top:-6vh;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}

/* Celular deitado */
@media (orientation:landscape) and (max-height:560px){
 .setup{display:grid;grid-template-columns:minmax(180px,32%) 1fr;grid-template-areas:"hero themes" "time themes" "play themes";grid-template-rows:auto auto 1fr;column-gap:10px}
 .hero{grid-area:hero;padding-top:0}.pick{grid-area:themes}.timebox{grid-area:time}.playbox{grid-area:play;align-self:end}
 .hero .logo{width:38px;height:38px;font-size:1.2rem}
 h1{font-size:1.3rem}.sub{display:none}
 .themes{grid-template-columns:repeat(2,1fr);gap:4px}
 .tile{padding:4px 6px}.ico{width:24px;height:24px;font-size:.7rem}
 .play{padding:8px;font-size:1rem}
 #game-screen{grid-template-columns:clamp(96px,17vw,150px) 1fr clamp(96px,17vw,150px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"skip bar ok" "skip word ok"}
 #word-display{font-size:clamp(2rem,16vh,4.2rem)}
 .p-only{display:none}.l-only{display:inline}
 .result{display:grid;grid-template-columns:minmax(190px,36%) 1fr;grid-template-areas:"top list" "btn list";grid-template-rows:1fr auto;column-gap:14px}
 .top{grid-area:top}.listbox{grid-area:list}.btnbox{grid-area:btn}
 .top .logo{width:38px;height:38px;font-size:1rem}
 .top h2{font-size:1.3rem!important}.top .sub{display:none}
 .stats{margin-top:6px}.stat b{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" aria-label="Tela cheia"><i id="fs-icon" class="fa-solid fa-expand"></i></button>

<!-- 1. MENU -->
<div id="setup-screen" class="screen bg-sun">
 <div class="setup">
  <div class="hero">
   <div class="logo"><i class="fa-solid fa-face-grin-stars"></i></div>
   <h1>Browser Guess PT-BR</h1>
   <p class="sub">Celular na testa, amigos dando dicas!</p>
   <div class="opts">
    <button id="opt-sound" class="opt" onclick="toggleOpt('sound')"><i class="fa-solid fa-volume-high"></i> Sons</button>
    <button id="opt-tilt" class="opt" onclick="toggleOpt('tilt')"><i class="fa-solid fa-mobile-screen"></i> Inclinar</button>
   </div>
  </div>
  <div class="pick">
   <p class="lbl"><i class="fa-solid fa-icons"></i> Escolha o tema</p>
   <div class="themes-wrapper"><div id="themes-container" class="themes"></div></div>
  </div>
  <div class="timebox">
   <p class="lbl"><i class="fa-solid fa-stopwatch"></i> Tempo de jogo</p>
   <div class="times">
    <button class="time-btn" data-time="30" onclick="setTime(30)">30s</button>
    <button class="time-btn" data-time="60" onclick="setTime(60)">1 min</button>
    <button class="time-btn" data-time="90" onclick="setTime(90)">1m30</button>
    <button class="time-btn" data-time="120" onclick="setTime(120)">2 min</button>
   </div>
  </div>
  <div class="playbox"><button class="btn play" onclick="startCountdown()"><i class="fa-solid fa-play"></i> Jogar agora</button></div>
 </div>
</div>

<!-- 2. CONTAGEM -->
<div id="countdown-screen" class="screen bg-sun hidden">
 <p style="font-weight:700;margin:0 0 4px">Prepare o celular na testa!</p>
 <div id="countdown-number">3</div>
 <div class="hint" id="hint"></div>
</div>

<!-- 3. JOGO -->
<div id="game-screen" class="screen hidden">
 <div id="flash"></div>
 <div id="fb"></div>
 <div class="bar">
  <div id="timer-box" class="pill"><i class="fa-solid fa-clock"></i><span id="timer-display">60</span>s</div>
  <div id="score-box" class="pill"><i class="fa-solid fa-star" style="color:#ffb400"></i><span id="live-score">0</span></div>
  <button class="x" onclick="endGame()" aria-label="Encerrar rodada"><i class="fa-solid fa-xmark"></i></button>
 </div>
 <div class="wordbox" onclick="handleCorrect()">
  <span id="current-theme-label" class="tag">Tema</span>
  <h2 id="word-display">...</h2>
 </div>
 <button class="btn act skip" onclick="event.stopPropagation();handleSkip()">
  <i class="fa-solid fa-arrow-up p-only"></i><i class="fa-solid fa-arrow-left l-only"></i>Pular
 </button>
 <button class="btn act ok" onclick="event.stopPropagation();handleCorrect()">
  <i class="fa-solid fa-arrow-down p-only"></i><i class="fa-solid fa-arrow-right l-only"></i>Acertou!
 </button>
</div>

<!-- 4. RESULTADO -->
<div id="result-screen" class="screen bg-sun hidden">
 <div class="result">
  <div class="top">
   <div class="logo"><i class="fa-solid fa-trophy"></i></div>
   <h2 id="res-title" style="margin:4px 0 0;font-size:1.6rem;color:#fff;text-shadow:0 2px 0 rgba(59,31,94,.35)">Fim de jogo!</h2>
   <p class="sub" id="res-sub">Que rodada divertida!</p>
   <div class="stats">
    <div class="card stat"><small>Acertos</small><b id="res-correct" style="color:#12b886">0</b></div>
    <div class="card stat"><small>Puladas</small><b id="res-skipped" style="color:#ff7a45">0</b></div>
   </div>
  </div>
  <div class="listbox">
   <p class="lbl"><i class="fa-solid fa-list-check"></i> Resumo da rodada</p>
   <div id="word-history" class="card"></div>
  </div>
  <div class="btnbox"><button class="btn play" onclick="returnToMenu()"><i class="fa-solid fa-rotate-right"></i> Jogar novamente</button></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);

let soundOn=true,tiltOn=true,tiltActive=false,tiltListening=false,tiltArmed=false;
const tiltSupported='DeviceOrientationEvent' in window;
function refreshOpts(){
 $('opt-sound').classList.toggle('on',soundOn);
 $('opt-sound').innerHTML=`<i class="fa-solid ${soundOn?'fa-volume-high':'fa-volume-xmark'}"></i> Sons`;
 $('opt-tilt').classList.toggle('on',tiltOn&&tiltSupported);
}
function toggleOpt(k){
 if(k==='sound')soundOn=!soundOn;else tiltOn=!tiltOn;
 try{localStorage.setItem('gg_sound',soundOn?'1':'0');localStorage.setItem('gg_tilt',tiltOn?'1':'0')}catch(e){}
 refreshOpts();playSound('click');
}

let audioCtx=null;
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
const SOUNDS={
 correct:[[660,0,.09,'triangle',.2],[990,.08,.16,'triangle',.2]],
 skip:[[330,0,.1,'sawtooth',.12,240],[220,.09,.16,'sawtooth',.1,150]],
 combo:[[523,0,.09,'triangle',.2],[659,.08,.09,'triangle',.2],[784,.16,.09,'triangle',.2],[1047,.24,.25,'triangle',.22]],
 beep:[[600,0,.1,'sine',.15]],
 start:[[800,0,.1,'sine',.2],[1200,.1,.28,'sine',.22]],
 tick:[[900,0,.05,'square',.05]],
 tick3:[[1300,0,.09,'square',.08]],
 click:[[520,0,.07,'sine',.1,720]],
 armed:[[880,0,.06,'sine',.1],[1320,.07,.09,'sine',.1]],
 buzz:[[180,0,.45,'sawtooth',.14,120]],
 win:[[523,0,.12,'triangle',.2],[659,.12,.12,'triangle',.2],[784,.24,.12,'triangle',.2],[1047,.36,.14,'triangle',.22],[784,.5,.1,'triangle',.2],[1047,.6,.4,'triangle',.24]],
 lose:[[392,0,.22,'sine',.15],[330,.22,.22,'sine',.15],[262,.44,.4,'sine',.15]]
};
function playSound(type){
 if(!soundOn)return;
 try{
  initAudio();if(!audioCtx)return;
  const seq=SOUNDS[type];if(!seq)return;
  const t0=audioCtx.currentTime;
  seq.forEach(([f,s,d,w,v,f2])=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type=w;o.connect(g);g.connect(audioCtx.destination);
   o.frequency.setValueAtTime(f,t0+s);
   if(f2)o.frequency.linearRampToValueAtTime(f2,t0+s+d);
   g.gain.setValueAtTime(v,t0+s);
   g.gain.exponentialRampToValueAtTime(.01,t0+s+d);
   o.start(t0+s);o.stop(t0+s+d+.02);
  });
 }catch(e){}
}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

function toggleFullScreen(){
 const el=document.documentElement;
 if(!document.fullscreenElement&&!document.webkitFullscreenElement){
  const r=el.requestFullscreen||el.webkitRequestFullscreen;
  if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{})}
 }else{const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document)}
}
function updateFsIcon(){
 const on=document.fullscreenElement||document.webkitFullscreenElement;
 document.getElementById('fs-icon').className=on?'fa-solid fa-compress':'fa-solid fa-expand';
}
document.addEventListener('fullscreenchange',updateFsIcon);
document.addEventListener('webkitfullscreenchange',updateFsIcon);
let wakeLock=null;
async function requestWakeLock(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWakeLock(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isPlaying)requestWakeLock()});

async function enableTilt(){
 if(!tiltSupported)return false;
 try{
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
   const r=await DeviceOrientationEvent.requestPermission();
   if(r!=='granted')return false;
  }
  if(!tiltListening){window.addEventListener('deviceorientation',onTilt);tiltListening=true}
  return true;
 }catch(e){return false}
}
function onTilt(e){
 if(e.beta==null||e.gamma==null)return;
 if(!isPlaying||!tiltActive)return;
 const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
 const z=Math.cos(g)*Math.cos(b);
 if(!tiltArmed){
  if(Math.abs(z)<0.3){tiltArmed=true;playSound('armed')}
  return;
 }
 if(z<-0.55){tiltArmed=false;handleCorrect()}
 else if(z>0.55){tiltArmed=false;handleSkip()}
}

const W=s=>s.split('|');

Object.values(themes).forEach(t=>{const seen=new Set();t.words=t.words.filter(w=>{const k=w.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})});
themes.misto={name:"Misto (tudo!)",icon:"fa-shuffle",c:["#ff4d8d","#ffc933"],words:[...new Set(Object.values(themes).flatMap(t=>t.words))]};

let selectedTheme='animais',gameTime=60,currentWords=[],currentIndex=0,scoreCorrect=0,scoreSkipped=0,streak=0,
 wordHistoryList=[],timerInterval=null,countdownTimeout=null,endTime=0,timeLeft=60,
 isPlaying=false,isCounting=false,lastAction=0,lastShownWord=null;

function loadPrefs(){try{
 const t=localStorage.getItem('ggpt_theme'),s=parseInt(localStorage.getItem('ggpt_time'),10);
 if(t&&themes[t])selectedTheme=t;if([30,60,90,120].includes(s))gameTime=s;
 if(localStorage.getItem('ggpt_sound')==='0')soundOn=false;
 if(localStorage.getItem('ggpt_tilt')==='0')tiltOn=false;
}catch(e){}}
function savePrefs(){try{localStorage.setItem('ggpt_theme',selectedTheme);localStorage.setItem('ggpt_time',String(gameTime))}catch(e){}}

function addBubbles(el){
 const em=['🎈','⭐','✨','🎉','🍭','💫','🎵'];
 for(let i=0;i<9;i++){
  const s=document.createElement('span');s.className='bub';s.textContent=em[i%em.length];
  s.style.left=(Math.random()*94)+'%';s.style.fontSize=(18+Math.random()*22)+'px';
  s.style.animationDuration=(11+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';
  el.prepend(s);
 }
}

function initThemes(){
 const box=$('themes-container');box.innerHTML='';
 for(const [key,t] of Object.entries(themes)){
  const b=document.createElement('button');
  b.className='card tile'+(key===selectedTheme?' sel':'');
  b.onclick=()=>{selectedTheme=key;savePrefs();playSound('click');initThemes()};
  const ico=document.createElement('div');ico.className='ico';
  ico.style.background=`linear-gradient(135deg,${t.c[0]},${t.c[1]})`;
  ico.innerHTML=`<i class="fa-solid ${t.icon}"></i>`;
  const txt=document.createElement('div');
  const n=document.createElement('b');n.textContent=t.name;
  const s=document.createElement('small');s.textContent=t.words.length+' palavras';
  txt.append(n,s);b.append(ico,txt);box.appendChild(b);
 }
 const sel=box.querySelector('.sel');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}
function setTime(sec){
 gameTime=sec;savePrefs();playSound('click');
 document.querySelectorAll('.time-btn').forEach(b=>b.classList.toggle('sel',parseInt(b.dataset.time,10)===sec));
}
function shuffleArray(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function setBg(el){const c=themes[selectedTheme].c;el.style.background=`linear-gradient(160deg,${c[0]},${c[1]})`}

function startCountdown(){
 if(isCounting||isPlaying)return;
 isCounting=true;initAudio();playSound('click');
 tiltActive=false;tiltArmed=false;
 const hint=$('hint');
 hint.innerHTML='<i class="fa-solid fa-hand-pointer"></i> Deslize ↓ ou → para acertar · ↑ ou ← para pular';
 if(tiltOn){
  enableTilt().then(ok=>{
   tiltActive=ok;
   hint.innerHTML=ok
    ?'<i class="fa-solid fa-mobile-screen"></i> Incline para <b>baixo</b> = acertou · para <b>cima</b> = pulou<br><small>(deslizar e tocar também funcionam)</small>'
    :'<i class="fa-solid fa-hand-pointer"></i> Sensor indisponível. Deslize ↓ → acertar · ↑ ← pular';
  });
 }
 currentWords=shuffleArray(themes[selectedTheme].words);
 currentIndex=0;scoreCorrect=0;scoreSkipped=0;streak=0;wordHistoryList=[];lastShownWord=null;
 document.body.classList.add('in-game');
 $('setup-screen').classList.add('hidden');
 const cs=$('countdown-screen');setBg(cs);cs.classList.remove('hidden');
 let count=3;const num=$('countdown-number');num.innerText=count;playSound('beep');vibrate(30);
 const step=()=>{
  count--;
  if(count>0){num.innerText=count;playSound('beep');vibrate(30)}
  else if(count===0){num.innerText='JÁ!';playSound('start');vibrate([60,40,60])}
  else{cs.classList.add('hidden');isCounting=false;startGame();return}
  countdownTimeout=setTimeout(step,1000);
 };
 countdownTimeout=setTimeout(step,1000);
}

function startGame(){
 isPlaying=true;lastAction=0;tiltArmed=false;requestWakeLock();
 const gs=$('game-screen');setBg(gs);gs.classList.remove('hidden');
 $('current-theme-label').innerText=themes[selectedTheme].name;
 $('live-score').innerText='0';$('timer-box').classList.remove('urgent');
 timeLeft=gameTime;$('timer-display').innerText=timeLeft;
 showNextWord('ok');
 endTime=Date.now()+gameTime*1000;
 timerInterval=setInterval(()=>{
  const r=Math.max(0,Math.ceil((endTime-Date.now())/1000));
  if(r!==timeLeft){
   timeLeft=r;$('timer-display').innerText=r;
   if(r<=10&&r>0){$('timer-box').classList.add('urgent');playSound(r<=3?'tick3':'tick')}
  }
  if(r<=0)endGame(true);
 },200);
}
function showNextWord(kind){
 if(currentIndex>=currentWords.length){
  currentWords=shuffleArray(themes[selectedTheme].words);currentIndex=0;
  if(currentWords.length>1&&currentWords[0]===lastShownWord)[currentWords[0],currentWords[1]]=[currentWords[1],currentWords[0]];
 }
 lastShownWord=currentWords[currentIndex];
 const el=$('word-display');el.textContent=lastShownWord;
 el.classList.remove('in-ok','in-skip');void el.offsetWidth;el.classList.add(kind==='skip'?'in-skip':'in-ok');
}
function canAct(){
 if(!isPlaying)return false;
 const n=Date.now();if(n-lastAction<350)return false;
 lastAction=n;return true;
}
function flash(color){
 const f=$('flash');f.style.background=color;f.style.opacity='.6';
 setTimeout(()=>{f.style.opacity='0'},170);
}
function feedback(text,color){
 const f=$('fb');f.textContent=text;f.style.color=color;
 f.classList.remove('show');void f.offsetWidth;f.classList.add('show');
}
function burst(emojis){
 for(let i=0;i<12;i++){
  const p=document.createElement('span');p.className='part';p.textContent=emojis[i%emojis.length];
  const a=Math.random()*Math.PI*2,d=90+Math.random()*130;
  p.style.left='50%';p.style.top='45%';p.style.fontSize=(16+Math.random()*16)+'px';
  p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');
  document.body.appendChild(p);setTimeout(()=>p.remove(),800);
 }
}
function handleCorrect(){
 if(!canAct())return;
 scoreCorrect++;streak++;
 wordHistoryList.push({word:currentWords[currentIndex],status:'correct'});
 $('live-score').innerText=scoreCorrect;
 const sb=$('score-box');sb.classList.remove('bump');void sb.offsetWidth;sb.classList.add('bump');
 flash('#12b886');vibrate(40);
 if(streak>=3&&streak%3===0){playSound('combo');feedback('🔥 Sequência x'+streak+'!','#fff176');burst(['🔥','⭐','✨'])}
 else{playSound('correct');feedback('✔ Acertou!','#b9f6ca');burst(['⭐','✨','🎉'])}
 currentIndex++;showNextWord('ok');
}
function handleSkip(){
 if(!canAct())return;
 playSound('skip');scoreSkipped++;streak=0;
 wordHistoryList.push({word:currentWords[currentIndex],status:'skipped'});
 flash('#ff3b5c');vibrate([30,30,30]);feedback('⏭ Pulou','#ffd180');
 const g=$('game-screen');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
 currentIndex++;showNextWord('skip');
}

let tY=0,tX=0;
window.addEventListener('touchstart',e=>{if(!isPlaying)return;tY=e.changedTouches[0].screenY;tX=e.changedTouches[0].screenX},{passive:true});
window.addEventListener('touchend',e=>{
 if(!isPlaying)return;
 const dy=e.changedTouches[0].screenY-tY,dx=e.changedTouches[0].screenX-tX;
 if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;
 const good=Math.abs(dy)>=Math.abs(dx)?dy>0:dx>0;
 good?handleCorrect():handleSkip();
},{passive:true});

function confetti(){
 const em=['🎉','⭐','🎈','✨','🍭','🎊'];
 for(let i=0;i<30;i++){
  const s=document.createElement('span');s.className='confetti';s.textContent=em[i%em.length];
  s.style.left=Math.random()*96+'vw';s.style.fontSize=(18+Math.random()*18)+'px';
  s.style.animationDuration=(2.2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.8)+'s';
  document.body.appendChild(s);setTimeout(()=>s.remove(),5400);
 }
}
function countUp(el,to){
 el.innerText='0';if(!to)return;
 let n=0;const step=Math.max(60,Math.min(140,900/to));
 const iv=setInterval(()=>{n++;el.innerText=n;if(n>=to)clearInterval(iv)},step);
}
function endGame(timeUp){
 if(!isPlaying)return;
 isPlaying=false;tiltArmed=false;clearInterval(timerInterval);releaseWakeLock();
 $('game-screen').classList.add('hidden');
 $('result-screen').classList.remove('hidden');
 $('res-title').innerText=scoreCorrect>=10?'Arrasou! 🏆':scoreCorrect>0?'Fim de jogo!':'Tente de novo!';
 $('res-sub').innerText=scoreCorrect>=10?'Que rodada incrível!':scoreCorrect>0?'Que rodada divertida!':'Na próxima vai!';
 countUp($('res-correct'),scoreCorrect);countUp($('res-skipped'),scoreSkipped);
 const box=$('word-history');box.innerHTML='';
 if(!wordHistoryList.length){
  const p=document.createElement('p');p.style.cssText='text-align:center;font-size:.85rem;opacity:.6';
  p.textContent='Nenhuma palavra jogada.';box.appendChild(p);
 }else{
  wordHistoryList.forEach((it,i)=>{
   const ok=it.status==='correct';
   const row=document.createElement('div');row.className='row';row.style.animationDelay=Math.min(i*40,800)+'ms';
   const w=document.createElement('span');w.textContent=it.word;
   const c=document.createElement('span');c.className='chip '+(ok?'ok':'no');c.textContent=ok?'Acertou':'Pulou';
   row.append(w,c);box.appendChild(row);
  });
 }
 if(timeUp)playSound('buzz');
 setTimeout(()=>playSound(scoreCorrect>0?'win':'lose'),timeUp?500:0);
 if(scoreCorrect>0)confetti();
}
function returnToMenu(){
 $('result-screen').classList.add('hidden');
 $('setup-screen').classList.remove('hidden');
 document.body.classList.remove('in-game');
 playSound('click');initThemes();
}
window.onload=()=>{
 loadPrefs();refreshOpts();initThemes();setTime(gameTime);
 ['setup-screen','countdown-screen','result-screen'].forEach(id=>addBubbles($(id)));
};
